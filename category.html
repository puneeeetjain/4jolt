<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>4Jolt Category</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top-header simple">
    <a class="logo" href="index.html">4Jolt</a>
  </header>
  <main class="content narrow" id="category-content"></main>
  <script src="scripts/data.js"></script>
  <script>
    const data = getSiteData();
    ensureScheduledPostsPublished(data);
    saveSiteData(data);
    const id = new URLSearchParams(window.location.search).get('id');
    const category = data.categories.find((c) => c.id === id);
    const posts = data.posts.filter((p) => p.categoryId === id && p.status === 'published');
    const container = document.getElementById('category-content');
    container.innerHTML = `
      <h1>${category?.name || 'Category'}</h1>
      <p><a href="index.html">← Back to home</a></p>
      <div class="grid">${posts.map((post) => `
        <a class="card" href="post.html?id=${post.id}">
          <img src="${post.image}" alt="${post.title}" />
          <h3>${post.title}</h3>
        </a>`).join('')}</div>
    `;
  </script>
</body>
</html>
